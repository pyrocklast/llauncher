apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.olauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 114
        versionName "v6.10.27"

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh", "zh-rTW"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
}

// ---------------------------------------------------------------------------------------------
// Olauncher Lite. Every build setting this fork changes is in this block, so that upstream's
// own lines above, like its version bumps, merge without conflicts. Gradle applies this block
// after upstream's, so the values here win. The only other change above is that the
// WorkManager dependency is gone.
// ---------------------------------------------------------------------------------------------

// Release signing: on your PC from keystore.properties in the project root (never committed),
// on GitHub from LITE_* environment variables set by the Release workflow.
// With neither, the release APK is built unsigned. See BUILD.md.
def liteKeystoreFile = rootProject.file("keystore.properties")
def liteKeystore = new Properties()
if (liteKeystoreFile.exists()) {
    liteKeystoreFile.withInputStream { liteKeystore.load(it) }
}
def liteSigning = [
        storeFile    : System.getenv("LITE_STORE_FILE") ?: liteKeystore["storeFile"],
        storePassword: System.getenv("LITE_STORE_PASSWORD") ?: liteKeystore["storePassword"],
        keyAlias     : System.getenv("LITE_KEY_ALIAS") ?: liteKeystore["keyAlias"],
        keyPassword  : System.getenv("LITE_KEY_PASSWORD") ?: liteKeystore["keyPassword"],
]

android {
    defaultConfig {
        // Own package name, so it installs alongside upstream Olauncher
        applicationId "app.olauncher.lite"
        // The Release workflow names each build after its GitHub release, e.g. v6.10.27-lite.3,
        // so Obtainium can tell versions apart. Builds on your PC are named e.g. v6.10.27-lite.
        if (project.hasProperty("liteVersionName")) {
            versionName project.property("liteVersionName")
        } else {
            versionNameSuffix "-lite"
        }
    }

    signingConfigs {
        release {
            if (liteSigning.storeFile) {
                storeFile rootProject.file(liteSigning.storeFile)
                storePassword liteSigning.storePassword
                keyAlias liteSigning.keyAlias
                keyPassword liteSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (liteSigning.storeFile) {
                signingConfig signingConfigs.release
            }
            // Drop resources nothing uses any more (old icons, animations, layouts)
            shrinkResources true
        }
    }
}

dependencies {
    // Native settings screen
    implementation "androidx.preference:preference-ktx:1.2.1"
}
