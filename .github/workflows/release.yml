# Olauncher Lite: builds a signed APK on GitHub and publishes it as a GitHub release,
# which Obtainium on your phone then offers as an update.
#
# Run it from the repository's Actions tab: Release > Run workflow.
# It needs the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets; see "Building on GitHub" in BUILD.md.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Work out the version
        id: version
        run: |
          # Upstream's version (e.g. v6.10.27) plus this workflow's run number: v6.10.27-lite.3
          upstream=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$upstream" ]; then
            echo "::error::Couldn't find versionName in app/build.gradle"
            exit 1
          fi
          echo "name=${upstream}-lite.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (Settings > Secrets and variables > Actions). See BUILD.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LITE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LITE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Optional secrets: the alias defaults to "lite" (as in BUILD.md), the key password to the keystore's
          LITE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lite' }}
          LITE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease "-PliteVersionName=$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # Gradle names the APK app-release-unsigned.apk when signing didn't happen
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was built. Check the signing secrets."
            exit 1
          fi
          cp "$apk" "OlauncherLite-$VERSION.apk"
          gh release create "$VERSION" "OlauncherLite-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Olauncher Lite $VERSION" \
            --notes "Built by the Release workflow from commit $GITHUB_SHA."

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
        
