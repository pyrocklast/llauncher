# Olauncher Lite: merges Olauncher's latest changes into this repository.
#
# Run it from the repository's Actions tab: Sync with Olauncher > Run workflow.
# Then run Release to build an APK with the changes.
# Files Lite deleted on purpose stay deleted even if Olauncher has changed them, and Lite's README
# is always kept. Any other clash with Lite's changes stops the sync without changing anything;
# the merge then has to be done by hand in git.

name: Sync with Olauncher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge Olauncher's changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lets .gitattributes keep this fork's README when Olauncher changes theirs
          git config merge.ours.driver true
          git remote add upstream https://github.com/tanujnotes/Olauncher.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with Olauncher. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "New Olauncher changes:" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline --no-merges HEAD..upstream/master | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

          if ! git merge --no-edit upstream/master; then
            # Files Lite deleted on purpose (removed features, Olauncher-only docs) stay deleted
            git status --porcelain | sed -n 's/^DU //p' > "$RUNNER_TEMP/kept-deleted.txt"
            while IFS= read -r file; do
              git rm -q -- "$file"
            done < "$RUNNER_TEMP/kept-deleted.txt"

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git merge --abort
              echo "::error::Olauncher's changes clash with Lite's, so nothing was changed. The merge has to be done by hand in git."
              exit 1
            fi
            git commit --no-edit
            if [ -s "$RUNNER_TEMP/kept-deleted.txt" ]; then
              echo "Kept deleted (Olauncher changed them, Lite doesn't use them):" >> "$GITHUB_STEP_SUMMARY"
              sed 's/^/- /' "$RUNNER_TEMP/kept-deleted.txt" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          git push
          echo "Merged. Run the Release workflow to build an APK with these changes." >> "$GITHUB_STEP_SUMMARY"

